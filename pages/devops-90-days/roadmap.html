<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Complete Roadmap | 90 Days of DevOps</title>
  <meta name="description" content="Complete Roadmap - part of the 90 Days of DevOps portal.">
  <meta name="color-scheme" content="dark light">

  <!-- Inter font (same as the rest of the site) -->

  <!-- Shared portal stylesheet (css/devops-90-days.css) -->
  <link rel="stylesheet" href="../../css/devops-90-days.css">
</head>

<!--
  Document page.
  data-page : tells devops-90-days.js to run the Markdown "document" renderer.
  data-nav  : highlights the matching link in the main navigation.
  data-doc  : key of the document to load (see D90.DOCS in devops-90-days-data.js).
-->
<body data-page="doc" data-nav="roadmap" data-doc="roadmap">
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- Header is injected by devops-90-days.js -->
  <header id="site-header"></header>

  <noscript>
    <div class="container"><p>This learning portal requires JavaScript. Enable JavaScript to use the lessons and progress tracker.</p></div>
  </noscript>

  <main id="main">
    <div class="container">

      <!-- Page title block: title, blurb, breadcrumbs and action buttons are filled in by JavaScript -->
      <div class="page-hero">
        <div id="doc-crumbs" class="crumbs"></div>
        <h1 id="doc-title">Complete Roadmap</h1>
        <p id="doc-blurb"></p>
        <div class="actions" id="doc-actions"></div>
      </div>

      <!-- Resource content is generated locally from the bundled curriculum metadata. -->
      <article id="md" class="md" aria-live="polite">
        <p class="loading">Loading…</p>
      </article>

    </div>
  </main>

  <!-- Footer is injected by devops-90-days.js -->
  <footer id="site-footer"></footer>

  <!-- No remote Markdown libraries are required. -->

  <!-- Local scripts: curriculum data first, then application logic. -->
  <!-- Markdown libraries: parser + sanitizer. No Jekyll or GitHub API is used. -->
  <script defer src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

  <!-- Application scripts: data/config first, repository Markdown loader second, UI last. -->
  <script defer src="../../js/devops-90-days-data.js"></script>
  <script defer src="../../js/devops-90-days-markdown.js"></script>
  <script defer src="../../js/devops-90-days.js"></script>
</body>
</html>
