<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Articles | 90 Days of DevOps</title>
  <meta name="description" content="LinkedIn and Medium articles connected to the 90 Days of DevOps curriculum.">
  <meta name="color-scheme" content="dark light">

  <!-- Inter font (same as the rest of the site) -->

  <!-- Shared portal stylesheet (css/devops-90-days.css) -->
  <link rel="stylesheet" href="../../css/devops-90-days.css">
</head>

<!-- data-page="articles" runs pageArticles() in devops-90-days.js -->
<body data-page="articles" data-nav="articles">
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- Header is injected by devops-90-days.js -->
  <header id="site-header"></header>

  <noscript>
    <div class="container"><p>This learning portal requires JavaScript. Enable JavaScript to use the lessons and progress tracker.</p></div>
  </noscript>

  <main id="main">
    <div class="container">

      <!-- Page title block with links to the author's article profiles -->
      <div class="page-hero">
        <div class="crumbs"><a href="../90-days-devops.html">90 Days</a> › Articles</div>
        <h1>DevOps Knowledge &amp; Articles</h1>
        <p>Technical tutorials, engineering experiences and lessons learned from the 90 days, published on LinkedIn and Medium.</p>
        <div class="actions">
          <a class="btn primary small" id="p-linkedin" href="#">LinkedIn profile ↗</a>
          <a class="btn small" id="p-medium" href="#">Medium profile ↗</a>
        </div>
      </div>

      <!-- Search box plus platform and topic filter chips -->
      <div class="toolbar">
        <div class="toolbar-row">
          <input id="a-q" class="field search" type="search" placeholder="Search articles" aria-label="Search articles">
        </div>
        <div class="toolbar-row" style="margin-top:10px" id="plat-chips" aria-label="Filter by platform"></div>
        <div class="toolbar-row" style="margin-top:8px" id="tag-chips" aria-label="Filter by topic"></div>
      </div>

      <!-- Article cards (rendered by JavaScript) -->
      <div class="grid cols-3" id="articles">
        <p class="loading">Loading articles…</p>
      </div>
    </div>
  </main>

  <!-- Footer is injected by devops-90-days.js -->
  <footer id="site-footer"></footer>

  <!-- No remote Markdown libraries are required. -->

  <!-- Local scripts: curriculum data first, then application logic. -->
  <script src="../../js/devops-90-days-data.js"></script>
  <script src="../../js/devops-90-days.js"></script>
</body>
</html>
