<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Articles | 90 Days of DevOps</title>
  <meta name="description" content="LinkedIn and Medium articles connected to the 90 Days of DevOps curriculum.">
  <meta name="color-scheme" content="dark light">

  <!-- Shared portal stylesheet, then the page-specific stylesheet -->
  <link rel="stylesheet" href="../../css/devops-90-days.css">
  <link rel="stylesheet" href="../../css/articles.css">
</head>

<body data-page="articles" data-nav="articles">
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- Header is injected by devops-90-days.js -->
  <header id="site-header"></header>

  <noscript>
    <div class="container"><p>This learning portal requires JavaScript. Enable JavaScript to use the lessons and progress tracker.</p></div>
  </noscript>

  <main id="main">
    <div class="container">

      <!-- Page title block -->
      <div class="page-hero">
        <div class="crumbs"><a href="../90-days-devops.html">90 Days</a> › Articles</div>
        <h1>DevOps Knowledge &amp; Articles</h1>
        <p>Technical tutorials, engineering experiences and lessons learned from the 90 days, published on LinkedIn and Medium.</p>
        <div class="actions">
          <a class="btn primary small" id="p-linkedin" href="#" target="_blank" rel="noopener noreferrer">LinkedIn profile ↗</a>
          <a class="btn small" id="p-medium" href="#" target="_blank" rel="noopener noreferrer">Medium profile ↗</a>
        </div>
      </div>

      <!-- The ONLY search bar: search + source filter + refresh -->
      <section class="articles-toolbar" aria-label="Search and filter articles">
        <input
          type="search"
          id="article-search"
          placeholder="Search DevOps articles..."
          aria-label="Search articles"
          autocomplete="off"
        >

        <select id="article-source-filter" aria-label="Filter articles by source">
          <option value="all">All Sources</option>
          <option value="medium">Medium</option>
          <option value="linkedin">LinkedIn</option>
        </select>

        <button id="articles-refresh" type="button">↻ Refresh Articles</button>
      </section>

      <!-- Loading / result status -->
      <p id="articles-status" aria-live="polite">Loading articles...</p>

      <!-- Article cards are inserted here by articles.js -->
      <section id="articles-grid" class="dn-grid" aria-label="DevOps articles"></section>

    </div>
  </main>

  <!--
    Legacy placeholders.
    devops-90-days.js (pageArticles) still looks for these elements and used to
    render the second search bar and the "No published articles yet" message.
    They are kept hidden so that script never fails or shows anything.
  -->
  <div hidden aria-hidden="true">
    <input id="a-q" type="search" tabindex="-1">
    <div id="plat-chips"></div>
    <div id="tag-chips"></div>
    <div id="articles"></div>
  </div>

  <!-- Footer is injected by devops-90-days.js -->
  <footer id="site-footer"></footer>

  <!-- Local scripts: curriculum data, site logic, then the articles aggregator (loaded once). -->
  <script src="../../js/devops-90-days-data.js"></script>
  <script src="../../js/devops-90-days.js"></script>
  <script src="../../js/articles.js"></script>
</body>
</html>
