<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assessments &amp; Certification | 90 Days of DevOps</title>
  <meta name="description" content="Assessments &amp; Certification - part of the 90 Days of DevOps portal.">
  <meta name="color-scheme" content="dark light">

  <!-- Inter font (same as the rest of the site) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Shared portal stylesheet (css/devops-90-days.css) -->
  <link rel="stylesheet" href="../../css/devops-90-days.css">
</head>

<!--
  Document page.
  data-page : tells devops-90-days.js to run the Markdown "document" renderer.
  data-nav  : highlights the matching link in the main navigation.
  data-doc  : key of the document to load (see D90.DOCS in devops-90-days-data.js).
-->
<body data-page="doc" data-nav="" data-doc="assessments">
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- Header is injected by devops-90-days.js -->
  <header id="site-header"></header>

  <noscript>
    <div class="container">
      <p>
        This portal needs JavaScript to load the lessons. You can read everything directly in the
        <a href="https://github.com/awsrmmustansarjavaid/awsrmmustansarjavaid/tree/main/DEVOPS-90-DAYS">GitHub repository</a>.
      </p>
    </div>
  </noscript>

  <main id="main">
    <div class="container">

      <!-- Page title block: title, blurb, breadcrumbs and action buttons are filled in by JavaScript -->
      <div class="page-hero">
        <div id="doc-crumbs" class="crumbs"></div>
        <h1 id="doc-title">Assessments &amp; Certification</h1>
        <p id="doc-blurb"></p>
        <div class="actions" id="doc-actions"></div>
      </div>

      <!-- Markdown content fetched from the GitHub repository -->
      <article id="md" class="md" aria-live="polite">
        <p class="loading">Loading…</p>
      </article>

    </div>
  </main>

  <!-- Footer is injected by devops-90-days.js -->
  <footer id="site-footer"></footer>

  <!-- Third-party libraries: Markdown parser, HTML sanitiser, syntax highlighter -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <!-- Portal scripts (order matters: data -> renderer -> page logic) -->
  <script src="../../js/devops-90-days-data.js"></script>
  <script src="../../js/devops-90-days-markdown-renderer.js"></script>
  <script src="../../js/devops-90-days.js"></script>
</body>
</html>
