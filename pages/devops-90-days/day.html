<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Lesson | 90 Days of DevOps</title>
  <meta name="description" content="A single daily lesson from the 90 Days of DevOps curriculum.">
  <meta name="color-scheme" content="dark light">

  <!-- Inter font (same as the rest of the site) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Shared portal stylesheet (css/devops-90-days.css) -->
  <link rel="stylesheet" href="../../css/devops-90-days.css">
</head>

<!--
  Single lesson page. The lesson number comes from the URL, e.g. day.html?day=42.
  data-page="day" runs pageDay() in devops-90-days.js.
-->
<body data-page="day" data-nav="roadmap">
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- Header is injected by devops-90-days.js -->
  <header id="site-header"></header>

  <noscript>
    <div class="container">
      <p>
        This portal needs JavaScript to load the lessons. You can read everything directly in the
        <a href="https://github.com/awsrmmustansarjavaid/awsrmmustansarjavaid/tree/main/DEVOPS-90-DAYS">GitHub repository</a>.
      </p>
    </div>
  </noscript>

  <main id="main">
    <div class="container">

      <!-- Lesson title block: breadcrumbs, day number, title, summary, metadata and buttons -->
      <div id="day-hero" class="page-hero">
        <div id="day-crumbs" class="crumbs"></div>
        <span class="eyebrow" id="day-no">DAY</span>
        <h1 id="day-title">Loading…</h1>
        <p id="day-summary"></p>
        <div class="metagrid" id="day-meta"></div>
        <div class="actions" id="day-actions"></div>
      </div>

      <div class="layout">

        <!-- Lesson content rendered from the Markdown file in the GitHub repository -->
        <article id="md" class="md" aria-live="polite">
          <p class="loading">Loading lesson…</p>
        </article>

        <!-- Sidebar: checklist progress, table of contents, private notes, related articles -->
        <aside class="side" aria-label="Lesson tools">

          <div class="panel">
            <h4>Checklist progress</h4>
            <div class="progress" role="presentation"><i id="check-bar"></i></div>
            <p class="muted" style="margin:8px 0 0;font-size:.85rem" id="check-text"></p>
            <p class="muted" style="margin:4px 0 0;font-size:.85rem" id="reading"></p>
          </div>

          <div class="panel">
            <h4>On this page</h4>
            <ul class="toc" id="toc"></ul>
          </div>

          <div class="panel">
            <h4>My notes</h4>
            <textarea id="notes" class="field" placeholder="Private notes for this day…" aria-label="Personal notes"></textarea>
            <p class="muted" style="margin:6px 0 0;font-size:.78rem" id="notes-state">Stored only in this browser</p>
          </div>

          <!-- Hidden until at least one related article is found -->
          <div class="panel hidden" id="related-wrap">
            <h4>Related articles</h4>
            <ul id="related" style="margin:0;padding-left:18px"></ul>
          </div>

        </aside>
      </div>

      <!-- Previous / next lesson buttons -->
      <div class="pager" id="pager"></div>
    </div>
  </main>

  <!-- Footer is injected by devops-90-days.js -->
  <footer id="site-footer"></footer>

  <!-- Third-party libraries: Markdown parser, HTML sanitiser, syntax highlighter -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <!-- Portal scripts (order matters: data -> renderer -> page logic) -->
  <script src="../../js/devops-90-days-data.js"></script>
  <script src="../../js/devops-90-days-markdown-renderer.js"></script>
  <script src="../../js/devops-90-days.js"></script>
</body>
</html>
